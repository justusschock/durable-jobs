name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.22.x'
          - '1.23.x'
          - '1.24.x'
          - '1.25.x'
          - '1.26.x'
    env:
      GOPRIVATE: github.com/justusschock/*
      GONOSUMDB: github.com/justusschock/*
      GOWORK: off
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Configure private module access
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GO_MODULES_TOKEN" ]; then
            echo "GO_MODULES_TOKEN is required" >&2
            exit 1
          fi
          credentials_file="$RUNNER_TEMP/git-credentials"
          umask 077
          printf 'https://x-access-token:%s@github.com\n' "$GO_MODULES_TOKEN" > "$credentials_file"
          chmod 0600 "$credentials_file"
          git config --global credential.helper "store --file=$credentials_file"

      - name: Verify modules
        run: go mod verify

      - name: Verify private module versions
        shell: bash
        run: |
          go list -m all | awk '
            NF >= 2 && $1 ~ /^github\.com\/justusschock\/go-/ && $2 != "v0.2.0" {
              print "private modules must resolve at v0.2.0: " $0 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          '

      - name: Verify tidy state
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files

      - name: Remove private module credentials
        if: always()
        shell: bash
        run: |
          git config --global --unset-all credential.helper || true
          rm -f "$RUNNER_TEMP/git-credentials"
