name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'backend/postgres/v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  # Every Go module in the repository. backend/postgres is a nested module
  # with a replace directive pointing at the root module.
  MODULES: . backend/postgres

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', 'oldstable', 'stable']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'

      - name: Verify modules
        shell: bash
        run: |
          set -euo pipefail
          for module in $MODULES; do
            echo "::group::go mod verify ($module)"
            (cd "$module" && go mod verify)
            echo "::endgroup::"
          done

      - name: Vet
        shell: bash
        run: |
          set -euo pipefail
          for module in $MODULES; do
            echo "::group::go vet ($module)"
            (cd "$module" && go vet ./...)
            echo "::endgroup::"
          done

      - name: Test with race detector
        shell: bash
        run: |
          set -euo pipefail
          for module in $MODULES; do
            echo "::group::go test ($module)"
            (cd "$module" && go test -race -count=1 ./...)
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'

      - name: Check go.mod and go.sum are tidy
        shell: bash
        run: |
          set -euo pipefail
          for module in $MODULES; do
            (cd "$module" && go mod tidy -diff)
          done

      - name: golangci-lint (core module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: golangci-lint (backend/postgres module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend/postgres
          args: --config ../../.golangci.yml

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Pinned by digest; update the tag and the digest together.
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DURABLE_JOBS_POSTGRES_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'

      - name: Verify modules
        run: go mod verify

      - name: Test against PostgreSQL with race detector
        run: go test -race -count=1 -v ./...
